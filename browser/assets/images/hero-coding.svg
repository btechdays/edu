<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Computer Screen -->
  <rect x="50" y="50" width="300" height="180" rx="10" fill="#2c3e50"/>
  <rect x="60" y="70" width="280" height="140" rx="5" fill="#1e2832"/>

  <!-- Code Lines -->
  <rect x="80" y="90" width="100" height="8" rx="4" fill="#4CAF50"/>
  <rect x="190" y="90" width="60" height="8" rx="4" fill="#2196F3"/>
  <rect x="80" y="110" width="80" height="8" rx="4" fill="#FF9800"/>
  <rect x="170" y="110" width="120" height="8" rx="4" fill="#4CAF50"/>
  <rect x="80" y="130" width="140" height="8" rx="4" fill="#9C27B0"/>
  <rect x="80" y="150" width="90" height="8" rx="4" fill="#2196F3"/>
  <rect x="180" y="150" width="110" height="8" rx="4" fill="#FF9800"/>
  <rect x="80" y="170" width="160" height="8" rx="4" fill="#4CAF50"/>

  <!-- Computer Base -->
  <rect x="180" y="230" width="40" height="30" fill="#34495e"/>
  <ellipse cx="200" cy="270" rx="80" ry="10" fill="#bdc3c7"/>

  <!-- Floating Elements -->
  <circle cx="320" cy="80" r="15" fill="#4CAF50" opacity="0.7">
    <animate attributeName="cy" values="80;70;80" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="280" r="12" fill="#2196F3" opacity="0.6">
    <animate attributeName="cy" values="280;270;280" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="200" r="10" fill="#FF9800" opacity="0.8">
    <animate attributeName="cy" values="200;190;200" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>